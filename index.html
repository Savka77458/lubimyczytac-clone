<!DOCTYPE html>
<html lang="pl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>LubimyCzytać - Projekt</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="container">
        <header>
            <h1>Klon LubimyCzytać</h1>
            <p>Projekt semestralny — Etap 3</p> <p class="student-info">Wykonali: Vladyslav Savka (PL77458) i Dmytro Datsenko (PL77384)</p>
        </header>

        <main>
            <section class="form-section">
                <h2 id="formTitle">Dodaj nową książkę</h2> <form id="bookForm">
                    <div class="form-group">
                        <label for="title">Tytuł książki:</label>
                        <input type="text" id="title" placeholder="Np. Wiedźmin" required>
                    </div>
                    
                    <div class="form-group">
                        <label for="author">Autor:</label>
                        <input type="text" id="author" placeholder="Np. Andrzej Sapkowski" required>
                    </div>

                    <div class="form-group">
                        <label for="category">Kategoria:</label>
                        <select id="category" required>
                            <option value="Fantasy">Fantasy</option>
                            <option value="Sci-Fi">Sci-Fi</option>
                            <option value="Kryminał">Kryminał</option>
                            <option value="Powieść">Powieść</option>
                            <option value="Inne" selected>Inne</option>
                        </select>
                    </div>

                    <div class="form-group">
                        <label for="coverUrl">Link do okładki (opcjonalnie):</label>
                        <input type="text" id="coverUrl" placeholder="Wklej link do obrazka...">
                    </div>

                    <div class="form-group">
                        <label for="description">Opis:</label>
                        <textarea id="description" placeholder="Krótki opis książki..." rows="4" required></textarea>
                    </div>

                    <button type="submit" id="submitBtn">Dodaj do bazy</button>
                    <button type="button" id="cancelEditBtn" style="display: none; background-color: #95a5a6; margin-top: 10px;">Anuluj edycję</button>
                </form>
            </section>

            <section class="list-section">
                <h2>Lista książek w bazie</h2>
                
                <input type="text" id="searchInput" class="search-bar" placeholder="Szukaj po tytule lub autorze...">

                <div id="booksContainer">
                    <p class="loading">Ładowanie książek...</p>
                </div>
            </section>
        </main>
    </div>

    <div id="bookModal" class="modal">
        <div class="modal-content">
            <span class="close-btn">&times;</span>
            <h2 id="modalTitle">Tytuł</h2>
            <p class="modal-author">Autor: <span id="modalAuthor"></span></p>
            <p class="modal-author">Kategoria: <span id="modalCategory"></span></p>
            <div class="modal-desc" id="modalDesc"></div>
        </div>
    </div>

    <script src="app.js"></script>
</body>
</html>
