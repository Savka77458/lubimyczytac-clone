<!DOCTYPE html>
<html lang="pl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>LubimyCzytać - Projekt</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="container">
        <header>
            <h1>Klon LubimyCzytać</h1>
            <p>Projekt semestralny — Etap 1</p>
            <p class="student-info">Wykonali: Vladyslav Savka (PL77458) i Dmytro Datsenko (PL77384)</p>
        </header>

        <main>
            <section class="form-section">
                <h2>Dodaj nową książkę</h2>
                <form id="bookForm">
                    <div class="form-group">
                        <label for="title">Tytuł książki:</label>
                        <input type="text" id="title" placeholder="Np. Wiedźmin" required>
                    </div>
                    
                    <div class="form-group">
                        <label for="author">Autor:</label>
                        <input type="text" id="author" placeholder="Np. Andrzej Sapkowski" required>
                    </div>

                    <div class="form-group">
                        <label for="description">Opis:</label>
                        <textarea id="description" placeholder="Krótki opis książki..." rows="4" required></textarea>
                    </div>

                    <button type="submit" id="submitBtn">Dodaj do bazy</button>
                </form>
            </section>

            <section class="list-section">
                <h2>Lista książek w bazie</h2>
                <div id="booksContainer">
                    <p class="loading">Ładowanie książek...</p>
                    </div>
            </section>
        </main>
    </div>

    <script src="app.js"></script>

    <div id="bookModal" class="modal">
    <div class="modal-content">
        <span class="close-btn">&times;</span>
        <h2 id="modalTitle">Tytuł</h2>
        <p class="modal-author">Autor: <span id="modalAuthor"></span></p>
        <div class="modal-desc" id="modalDesc"></div>
    </div>
</div>
</body>
</html>
